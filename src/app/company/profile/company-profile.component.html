<main class="content-area p-4 p-lg-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <p class="text-muted mb-1">Company profile</p>
        <h2 class="fw-bold mb-0">Profile & Details</h2>
      </div>
      <div>
        @if (!editMode) {
          <button class="btn btn-danger" (click)="editMode = true">Edit</button>
        } @else {
          <div class="d-flex gap-2">
            <button class="btn btn-danger" (click)="save()">Save</button>
            <button class="btn btn-outline-secondary" (click)="editMode = false">Cancel</button>
          </div>
        }
      </div>
    </div>

    <div class="card-soft p-4">
      <div class="row g-4 align-items-center mb-4">
        <div class="col-md-3 text-center">
          <img [src]="company?.logo || 'https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=200&q=80'" class="rounded-circle mx-auto" style="width:120px;height:120px;object-fit:cover;" alt="Company logo" />
        </div>
        <div class="col-md-9">
          <h4 class="fw-bold mb-1">{{ company?.name }}</h4>
          <div class="text-muted mb-2">{{ company?.industry }} • {{ company?.location }}</div>
          @if (company?.website) {
            <a class="badge-soft bg-danger-subtle text-danger text-decoration-none d-inline-block" [href]="openUrl(company.website)" target="_blank" rel="noopener noreferrer">
              {{ company.website }}
            </a>
          } @else {
            <span class="badge-soft bg-light text-muted">No website added yet</span>
          }
        </div>
      </div>

      <form [formGroup]="form">
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label">Company Name</label><input class="form-control" formControlName="name" [attr.disabled]="!editMode ? true : null" /></div>
          <div class="col-md-6"><label class="form-label">Industry</label><input class="form-control" formControlName="industry" [attr.disabled]="!editMode ? true : null" /></div>
          <div class="col-md-6"><label class="form-label">Location</label><input class="form-control" formControlName="location" [attr.disabled]="!editMode ? true : null" /></div>
          <div class="col-md-6"><label class="form-label">Website</label><input class="form-control" formControlName="website" [attr.disabled]="!editMode ? true : null" /></div>
          <div class="col-md-12"><label class="form-label">Description</label><textarea class="form-control" rows="4" formControlName="description" [attr.disabled]="!editMode ? true : null"></textarea></div>
          <div class="col-md-4"><label class="form-label">HR Name</label><input class="form-control" formControlName="hrName" [attr.disabled]="!editMode ? true : null" /></div>
          <div class="col-md-4"><label class="form-label">HR Email</label><input class="form-control" formControlName="hrEmail" [attr.disabled]="!editMode ? true : null" /></div>
          <div class="col-md-4"><label class="form-label">HR Phone</label><input class="form-control" formControlName="hrPhone" [attr.disabled]="!editMode ? true : null" /></div>
        </div>
      </form>
    </div>
</main>
