<div class="auth-page d-flex align-items-center justify-content-center min-vh-100"><div class="form-card p-4" style="max-width:480px;width:100%;"><div class="text-center mb-4"><div class="brand-logo">JG</div><h2 class="fw-bold mt-3">Reset Password</h2><p class="text-secondary">Secure OTP based password reset.</p></div><form [formGroup]="form" (ngSubmit)="submit()"><div class="mb-3"><label class="form-label">College Email</label><input class="form-control" formControlName="email" type="email" placeholder="student@jg.edu" [readonly]="step===2"></div><div *ngIf="step===2"><div class="mb-3"><label class="form-label">OTP</label><input class="form-control" formControlName="otp" maxlength="6" placeholder="000000"></div><div class="mb-3"><label class="form-label">New Password</label><input class="form-control" formControlName="password" type="password" placeholder="Strong password"></div><div *ngIf="demoOtp" class="alert alert-warning">Demo OTP: <b>{{demoOtp}}</b></div></div><button class="btn btn-danger w-100 py-2" type="submit">{{step===1?'Send OTP':'Reset Password'}}</button><div class="text-center mt-3"><a routerLink="/login" class="text-danger text-decoration-none">Back to login</a></div></form></div></div>
