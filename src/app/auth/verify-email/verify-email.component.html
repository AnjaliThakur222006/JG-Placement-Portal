<div class="verify-page"><div class="card p-4"><div class="brand">JG</div><h2>Verify Email</h2><p class="text-secondary">Enter the 6-digit OTP sent to {{email}}</p><input class="form-control mb-3" [(ngModel)]="otp" maxlength="6" placeholder="000000"><button class="btn btn-danger w-100" (click)="verify()">Verify Email</button><button class="btn btn-link w-100 mt-2" (click)="resend()">Resend OTP</button><div *ngIf="demoOtp" class="alert alert-warning mt-3">Demo OTP: <b>{{demoOtp}}</b></div><div *ngIf="message" class="alert alert-info mt-3">{{message}}</div><a routerLink="/login">Back to login</a></div></div>
