<div class="placement-layout">
  <aside class="placement-sidebar" [class.sidebar-open]="sidebarOpen">
    <div class="sidebar-header">
      <div class="brand-mark">JG</div>
      <button class="btn btn-link text-white d-lg-none" type="button" (click)="toggleSidebar()" aria-label="Toggle placement navigation">
        <i class="fs-3" [ngClass]="sidebarOpen ? 'bi bi-x-lg' : 'bi bi-list'"></i>
      </button>
    </div>

    <div class="placement-identity">
      <div class="identity-icon"><i class="bi bi-shield-check"></i></div>
      <div class="fw-semibold">Placement Cell</div>
      <small>Operations Portal</small>
    </div>

    <nav class="nav-menu">
      <a routerLink="/placement/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeSidebar()"><i class="bi bi-grid-1x2-fill"></i>Dashboard</a>
      <a routerLink="/placement/students" routerLinkActive="active" (click)="closeSidebar()"><i class="bi bi-people"></i>Students</a>
      <a routerLink="/placement/companies" routerLinkActive="active" (click)="closeSidebar()"><i class="bi bi-building"></i>Companies</a>
      <a routerLink="/placement/jobs" routerLinkActive="active" (click)="closeSidebar()"><i class="bi bi-briefcase"></i>Jobs</a>
      <a routerLink="/placement/drives" routerLinkActive="active" (click)="closeSidebar()"><i class="bi bi-calendar2-week"></i>Placement Drives</a>
      <a routerLink="/placement/applications" routerLinkActive="active" (click)="closeSidebar()"><i class="bi bi-list-check"></i>Applications</a>
      <a routerLink="/placement/interviews" routerLinkActive="active" (click)="closeSidebar()"><i class="bi bi-calendar-event"></i>Interviews</a>
      <a routerLink="/placement/reports" routerLinkActive="active" (click)="closeSidebar()"><i class="bi bi-bar-chart"></i>Reports</a>
      <a routerLink="/placement/notifications" routerLinkActive="active" (click)="closeSidebar()"><i class="bi bi-bell"></i>Notifications</a>
      <a routerLink="/placement/tickets" routerLinkActive="active" (click)="closeSidebar()"><i class="bi bi-ticket-perforated"></i>Tickets</a>
      <a routerLink="/placement/verification" routerLinkActive="active" (click)="closeSidebar()"><i class="bi bi-patch-check"></i>Verification</a>
      <a routerLink="/placement/bulk-notifications" routerLinkActive="active" (click)="closeSidebar()"><i class="bi bi-megaphone"></i>Bulk Notify</a>
      <a routerLink="/placement/settings" routerLinkActive="active" (click)="closeSidebar()"><i class="bi bi-gear"></i>Settings</a>
    </nav>

    <button class="logout-link" type="button" (click)="logout()"><i class="bi bi-box-arrow-right"></i>Logout</button>
  </aside>

  <main class="placement-content">
    <router-outlet />
  </main>
</div>
