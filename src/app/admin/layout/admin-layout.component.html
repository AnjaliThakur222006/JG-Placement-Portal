<div class="admin-layout">
  <aside class="admin-sidebar" [class.sidebar-open]="sidebarOpen">
    <div class="sidebar-header">
      <div class="brand-mark">JG</div>
      <button class="btn btn-link text-white d-lg-none" type="button" (click)="toggleSidebar()" aria-label="Toggle admin navigation">
        <i class="fs-3" [ngClass]="sidebarOpen ? 'bi bi-x-lg' : 'bi bi-list'"></i>
      </button>
    </div>

    <div class="admin-identity">
      <div class="identity-icon"><i class="bi bi-shield-lock"></i></div>
      <div class="fw-semibold">Admin Console</div>
      <small>System Administration</small>
    </div>

    <nav class="nav-menu">
      <a routerLink="/admin/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeSidebar()"><i class="bi bi-grid-1x2-fill"></i>Dashboard</a>
      <a routerLink="/admin/users" routerLinkActive="active" (click)="closeSidebar()"><i class="bi bi-people"></i>Users</a>
      <a routerLink="/admin/students" routerLinkActive="active" (click)="closeSidebar()"><i class="bi bi-mortarboard"></i>Students</a>
      <a routerLink="/admin/companies" routerLinkActive="active" (click)="closeSidebar()"><i class="bi bi-building"></i>Companies</a>
      <a routerLink="/admin/roles" routerLinkActive="active" (click)="closeSidebar()"><i class="bi bi-person-badge"></i>Roles</a>
      <a routerLink="/admin/departments" routerLinkActive="active" (click)="closeSidebar()"><i class="bi bi-diagram-3"></i>Departments</a>
      <a routerLink="/admin/audit-logs" routerLinkActive="active" (click)="closeSidebar()"><i class="bi bi-journal-text"></i>Audit Logs</a>
      <a routerLink="/admin/reports" routerLinkActive="active" (click)="closeSidebar()"><i class="bi bi-file-earmark-bar-graph"></i>Reports</a>
      <a routerLink="/admin/ai-settings" routerLinkActive="active" (click)="closeSidebar()"><i class="bi bi-cpu"></i>AI Settings</a>
      <a routerLink="/admin/backup" routerLinkActive="active" (click)="closeSidebar()"><i class="bi bi-database-check"></i>Backup</a>
      <a routerLink="/admin/notifications" routerLinkActive="active" (click)="closeSidebar()"><i class="bi bi-bell"></i>Notifications</a>
      <a routerLink="/admin/database-health" routerLinkActive="active" (click)="closeSidebar()"><i class="bi bi-database"></i>Database Health</a>
      <a routerLink="/admin/settings" routerLinkActive="active" (click)="closeSidebar()"><i class="bi bi-gear"></i>Settings</a>
    </nav>

    <button class="logout-link" type="button" (click)="logout()"><i class="bi bi-box-arrow-right"></i>Logout</button>
  </aside>

  <main class="admin-content">
    <router-outlet />
  </main>
</div>
